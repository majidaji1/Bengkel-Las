<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="50" fill="#c8865a"/>
  <!-- Neck -->
  <rect x="38" y="68" width="24" height="18" rx="4" fill="#c47a4a"/>
  <!-- Shirt -->
  <ellipse cx="50" cy="95" rx="34" ry="18" fill="#2d4a7a"/>
  <!-- Head -->
  <ellipse cx="50" cy="44" rx="22" ry="24" fill="#d4905e"/>
  <!-- Hair -->
  <ellipse cx="50" cy="24" rx="22" ry="12" fill="#1a0e05"/>
  <rect x="28" y="20" width="44" height="12" rx="6" fill="#1a0e05"/>
  <!-- Left ear -->
  <ellipse cx="28" cy="45" rx="4" ry="5" fill="#c47a4a"/>
  <!-- Right ear -->
  <ellipse cx="72" cy="45" rx="4" ry="5" fill="#c47a4a"/>
  <!-- Eyebrows -->
  <path d="M36 35 Q42 32 45 35" stroke="#1a0e05" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <path d="M55 35 Q58 32 64 35" stroke="#1a0e05" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <!-- Eyes -->
  <ellipse cx="41" cy="40" rx="5" ry="4" fill="white"/>
  <ellipse cx="59" cy="40" rx="5" ry="4" fill="white"/>
  <circle cx="41" cy="40" r="2.8" fill="#2b1810"/>
  <circle cx="59" cy="40" r="2.8" fill="#2b1810"/>
  <circle cx="42.2" cy="38.8" r="0.9" fill="white"/>
  <circle cx="60.2" cy="38.8" r="0.9" fill="white"/>
  <!-- Nose -->
  <ellipse cx="50" cy="49" rx="3" ry="2" fill="#b86e42"/>
  <path d="M46 48 Q50 52 54 48" stroke="#b06038" stroke-width="1.3" fill="none"/>
  <!-- Mouth / smile -->
  <path d="M41 57 Q50 64 59 57" stroke="#8c4020" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M42 57 Q50 63 58 57" fill="#e88870" opacity="0.5"/>
