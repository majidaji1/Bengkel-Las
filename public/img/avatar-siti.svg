  <path d="M22 50 Q10 70 18 90 Q30 98 44 95" fill="#2c5f8a"/>
  <!-- Hijab drape right -->
  <path d="M78 50 Q90 70 82 90 Q70 98 56 95" fill="#2c5f8a"/>
