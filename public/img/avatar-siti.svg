  <!-- Eyes -->
  <ellipse cx="41" cy="42" rx="4.5" ry="3.5" fill="white"/>
  <ellipse cx="59" cy="42" rx="4.5" ry="3.5" fill="white"/>
  <circle cx="41" cy="42" r="2.5" fill="#2b1810"/>
  <circle cx="59" cy="42" r="2.5" fill="#2b1810"/>
  <circle cx="42" cy="41" r="0.8" fill="white"/>
  <circle cx="60" cy="41" r="0.8" fill="white"/>
  <!-- Nose -->
