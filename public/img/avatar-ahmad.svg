<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="50" fill="#9e6035"/>
  <!-- Neck -->
  <rect x="38" y="67" width="24" height="18" rx="4" fill="#b8703e"/>
  <!-- Shirt / kemeja -->
  <ellipse cx="50" cy="95" rx="34" ry="18" fill="#3a5c3a"/>
  <!-- Head -->
  <ellipse cx="50" cy="44" rx="22" ry="24" fill="#c07040"/>
  <!-- Short hair -->
  <ellipse cx="50" cy="23" rx="22" ry="10" fill="#0d0905"/>
  <rect x="28" y="20" width="44" height="11" rx="5" fill="#0d0905"/>
  <!-- Slight fade sides -->
  <rect x="28" y="28" width="8" height="10" rx="4" fill="#0d0905" opacity="0.6"/>
  <rect x="64" y="28" width="8" height="10" rx="4" fill="#0d0905" opacity="0.6"/>
  <!-- Left ear -->
  <ellipse cx="28" cy="45" rx="4" ry="5" fill="#b06038"/>
  <!-- Right ear -->
  <ellipse cx="72" cy="45" rx="4" ry="5" fill="#b06038"/>
  <!-- Eyebrows - thicker/masculine -->
  <path d="M35 36 Q41 32 46 35" stroke="#0d0905" stroke-width="2.8" fill="none" stroke-linecap="round"/>
  <path d="M54 35 Q59 32 65 36" stroke="#0d0905" stroke-width="2.8" fill="none" stroke-linecap="round"/>
  <!-- Eyes -->
  <ellipse cx="41" cy="42" rx="5" ry="3.8" fill="white"/>
  <ellipse cx="59" cy="42" rx="5" ry="3.8" fill="white"/>
  <circle cx="41" cy="42" r="2.8" fill="#1a0a05"/>
  <circle cx="59" cy="42" r="2.8" fill="#1a0a05"/>
  <circle cx="42.2" cy="41" r="0.9" fill="white"/>
  <circle cx="60.2" cy="41" r="0.9" fill="white"/>
  <!-- Nose - broader -->
  <ellipse cx="50" cy="50" rx="3.5" ry="2.2" fill="#a06030"/>
  <path d="M45 49 Q50 53 55 49" stroke="#905828" stroke-width="1.4" fill="none"/>
  <!-- Mouth -->
  <path d="M42 58 Q50 63 58 58" stroke="#7a3818" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <!-- Light mustache -->
  <path d="M43 55 Q50 57.5 57 55" stroke="#0d0905" stroke-width="1.3" fill="none" opacity="0.7"/>
</svg>
